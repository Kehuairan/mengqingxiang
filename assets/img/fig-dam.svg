<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="坝体、坝基与潜在滑面示意图">
  <defs>
    <pattern id="rock" width="28" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0h28M0 0l28 24M28 0L0 24" fill="none" stroke="#e4e4e4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="320" fill="#ffffff"/>

  <!-- 上游水体 -->
  <rect x="26" y="118" width="134" height="132" fill="#f5f5f5"/>
  <path d="M26 118h134" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="34" y="112" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11"
        letter-spacing="1.5" fill="#9a9a9a">上游水位</text>

  <!-- 坝基 -->
  <rect x="26" y="250" width="428" height="44" fill="url(#rock)"/>
  <path d="M26 250h428" stroke="#1d1d1d" stroke-width="1.6"/>

  <!-- 坝体 -->
  <path d="M160 250V116h44l64 134z" fill="#fbfbfb" stroke="#1d1d1d" stroke-width="1.6"/>
  <path d="M160 116h44" stroke="#1d1d1d" stroke-width="3"/>

  <!-- 潜在滑面 -->
  <path d="M172 252c34 44 116 44 164 0" fill="none" stroke="#6f9f00" stroke-width="2"
        stroke-dasharray="7 6"/>
  <circle cx="172" cy="252" r="3" fill="#6f9f00"/>
  <circle cx="336" cy="252" r="3" fill="#6f9f00"/>

  <!-- 水压力 -->
  <g stroke="#9a9a9a" stroke-width="1.2">
    <path d="M120 150h30m-6-4 6 4-6 4"/>
    <path d="M120 186h20m-6-4 6 4-6 4"/>
    <path d="M120 222h12m-6-4 6 4-6 4"/>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11"
     letter-spacing="1.5" fill="#8c8c8c">
    <text x="182" y="168">坝体</text>
    <text x="366" y="274">坝基</text>
    <text x="196" y="304" fill="#6f9f00">潜在滑面</text>
  </g>
</svg>
