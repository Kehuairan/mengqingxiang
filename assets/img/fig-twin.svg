<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="数字孪生：三维模型与监测数据联动示意图">
  <defs>
    <pattern id="twinmesh" width="26" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 0h26M0 0l26 22M26 0L0 22" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="320" fill="#ffffff"/>

  <!-- 三维坝段模型 -->
  <path d="M44 214l92-40 108 26-92 40z" fill="#fbfbfb" stroke="#1d1d1d" stroke-width="1.4"/>
  <path d="M44 214v44l92 40v-44z" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
  <path d="M136 258v40l108-26v-40z" fill="#f7f7f7" stroke="#1d1d1d" stroke-width="1.4"/>
  <path d="M44 214l92-40 108 26-92 40z" fill="url(#twinmesh)" opacity="0.9"/>

  <!-- 数据流 -->
  <g stroke="#6f9f00" stroke-width="1.4" fill="none">
    <path d="M258 196h52m-9-5 9 5-9 5"/>
    <path d="M310 214h-52m9 5-9-5 9-5"/>
  </g>
  <text x="262" y="186" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10"
        letter-spacing="1" fill="#6f9f00">数据 · 仿真</text>

  <!-- 监测面板 -->
  <rect x="316" y="70" width="140" height="180" fill="#ffffff" stroke="#dcdcdc"/>
  <path d="M316 96h140" stroke="#dcdcdc"/>
  <text x="328" y="88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10"
        letter-spacing="1" fill="#8c8c8c">监测 · 预测</text>

  <path d="M330 236c18-6 26-40 44-48s22 18 38 4 18-38 30-44" fill="none" stroke="#6f9f00"
        stroke-width="1.8" stroke-linecap="round"/>
  <g stroke="#ececec" stroke-width="1">
    <path d="M330 236h112"/>
    <path d="M330 196h112"/>
    <path d="M330 156h112"/>
  </g>

  <g fill="#e8e8e8">
    <rect x="330" y="104" width="18" height="34"/>
    <rect x="356" y="104" width="18" height="52"/>
    <rect x="382" y="104" width="18" height="26"/>
    <rect x="408" y="104" width="18" height="44"/>
  </g>
  <g fill="#bdbdbd">
    <rect x="330" y="138" width="18" height="6"/>
    <rect x="356" y="156" width="18" height="6"/>
    <rect x="382" y="130" width="18" height="6"/>
    <rect x="408" y="148" width="18" height="6"/>
  </g>

  <text x="46" y="296" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10"
        letter-spacing="1" fill="#9a9a9a">工程三维模型</text>
</svg>
